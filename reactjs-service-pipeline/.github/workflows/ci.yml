name: react-ci-gitops-promotion

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: react-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/project-02-react

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Verify the container builds
        run: docker build --build-arg RELEASE_VERSION=${GITHUB_SHA} -t react-ci:${GITHUB_SHA} .

  publish:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.ref_name }}-${{ github.sha }}
          build-args: RELEASE_VERSION=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Pull the published digest
        run: docker pull "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Scan the published image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  propose-gitops:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Require GitOps configuration
        env:
          REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
          TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: test -n "$REPOSITORY" && test -n "$TOKEN"
      - name: Clone GitOps repository
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: gh repo clone "${{ vars.GITOPS_REPOSITORY }}" gitops-repo
      - name: Update the matching environment and open a pull request
        working-directory: gitops-repo
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          ENVIRONMENT: ${{ github.ref_name }}
        run: |
          test "$ENVIRONMENT" = dev -o "$ENVIRONMENT" = prod
          branch="promote-${ENVIRONMENT}-${GITHUB_SHA::12}"
          file="environments/${ENVIRONMENT}/kustomization.yaml"
          git switch -c "$branch"
          sed -i -E "s#newName: .*#newName: ${IMAGE}#; s#digest: sha256:.*#digest: ${DIGEST}#" "$file"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add "$file"
          git commit -m "promote ${ENVIRONMENT} image ${GITHUB_SHA::12}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "Promote React ${ENVIRONMENT} ${GITHUB_SHA::12}" \
            --body "Environment: ${ENVIRONMENT}\n\nImmutable image: ${IMAGE}@${DIGEST}" \
            --base main \
            --head "$branch"

